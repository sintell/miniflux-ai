# Miniflux and the LLM gateway are existing services on reverse_proxy.
services:
  miniflux_ai:
    container_name: miniflux_ai
    image: ${MINIFLUX_AI_IMAGE:?Set Docker Hub namespace/repository:version or an image digest}
    restart: unless-stopped
    environment:
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY:?Set the separate Miniflux API key}
      LLM_API_KEY: ${LLM_API_KEY:?Set the local gateway API key}
      DIGEST_LANGUAGE: ${DIGEST_LANGUAGE:-English}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-UTC}
      FLASK_PORT: ${FLASK_PORT:-80}
    volumes:
      - ${MINIFLUX_AI_DIRECTORY:-.}/config.yml:/app/config.yml:ro
      - ${MINIFLUX_AI_DIRECTORY:-.}/data:/app/data
    networks:
      - reverse_proxy
    # Enable only after checking image compatibility and data ownership:
    # user: "1000:10"

networks:
  reverse_proxy:
    external: true
