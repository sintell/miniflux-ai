log_level: INFO
language: ${DIGEST_LANGUAGE:-English} # Language for ALL generated content

state:
  directory: /app/data # Mount the directory, not individual state files

miniflux:
  base_url: http://miniflux:8080 # Internal API URL
  browser_url: https://rss.home.antki.dev # User-facing article links
  api_key: ${MINIFLUX_API_KEY}
  schedule_interval: 15 # Polling interval in minutes
  enrichment_mode: legacy_content # Set metadata ONLY after the Miniflux fork is available
  timeout: 30 # Per-attempt API timeout in seconds
  retries: 2 # Bounded transport/429/temporary-5xx retries
  # webhook_secret: ${MINIFLUX_WEBHOOK_SECRET}

metadata:
  # Required in metadata mode: supply YOUR personal rating criteria (no default policy).
  relevance_criteria: ${MINIFLUX_AI_RELEVANCE_CRITERIA:-}
  input_fields: [] # Explicit registered client.field names; no wildcard or automatic other-app input
  # See docs/metadata.md for producer contracts and staged rollout.

article_fetch: # Metadata mode: read-only Miniflux preview using the feed's own rules
  mode: thin # "off", thin, or always; reuse stored content when already substantive
  min_feed_chars: 500 # Ignore link/counter wrappers when assessing feed text
  min_article_chars: 200 # Fail before generation if retrieval has too little readable text
  timeout: 30 # API timeout per attempt; publisher HTTP/redirect settings belong to Miniflux
  max_bytes: 2097152 # 2 MiB preview JSON response cap
  max_text_chars: 20000 # Retrieved excerpt; llm.max_length can impose a smaller limit
  retries: 1 # Temporary HTTP/transport failures only

llm:
  provider: openai # openai or gemini
  api: chat_completions # Explicit openai API: chat_completions (default) or responses
  # responses preserves backend failed/incomplete status through the Codex gateway.
  structured_output: prompt # Verified for gpt-6-luna via Codex; local JSON validation remains strict
  base_url: http://codex-api:18080/v1
  api_key: ${LLM_API_KEY} # Separate from Miniflux's API key
  model: gpt-6-luna
  timeout: 300
  max_workers: 2 # Global concurrent LLM requests in this process
  RPM: 15 # ALL LLM request starts per minute, including digests and retries
  retries: 2 # Bounded retries for connection/timeout/rate-limit/transient server failures
  # max_length: 20000 # Article text only; structured digest records are never sliced
  extra_params:
    reasoning_effort: low
  # Gemini example: provider: gemini, base_url: https://generativelanguage.googleapis.com
  # extra_params:
  #   thinking_config:
  #     thinking_budget: 0

ai_news:
  url: http://miniflux_ai:${FLASK_PORT:-80} # Base URL; appends /rss/ai-news
  timezone: ${DIGEST_TIMEZONE:-UTC} # Configure your IANA timezone before deployment
  schedule: ["07:30", "18:00", "22:00"]
  editions:
    morning: "05:00"
    evening: "12:00"
    night: "21:00"
  editorial:
    at_a_glance_words: 75 # Approximate word target, not padded to a quota
    max_stories: 8
    max_groups: 3 # 0 disables grouping
    story_words_min: 40
    story_words_max: 70
    article_words_min: 80
    article_words_max: 130
    max_records: 100
    max_input_chars: 60000 # Complete serialized input; overflow records stay queued
  weather:
    enabled: false
    location: "" # Display name; coordinates select the actual forecast location
    latitude: null
    longitude: null
    units: metric # metric: Celsius, km/h; imperial: Fahrenheit, mph
    timeout: 5 # seconds, maximum 30
    max_age_minutes: 30 # Omit the weather opening if generation exceeds this budget
    rain_probability_threshold: 30 # percent
    notable_wind_kmh: 30 # Converted to mph for imperial output
  # Optional prompts.article and prompts.digest replace defaults in services/editorial.py.
  # Preserve the digest JSON contract. ${language} and editorial placeholders are supported.

agents:
  summary:
    title: 'AI summary:'
    # The summary prompt now lives at ai_news.prompts.article.
    style_block: true
    deny_list:
      - https://ai-news.miniflux
    allow_list:
  translate:
    title: 'AI translation:'
    prompt: Translate the supplied article into ${language}, preserving journalistic nuance and uncertainty. Do not add commentary.
    style_block: false
    allow_list:
      - https://www.xxx.com/

feeds_status:
  enabled: true
  url: http://miniflux_ai:${FLASK_PORT:-80}
  schedule: "09:00"
