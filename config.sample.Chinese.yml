# 完整配置说明和天气/编辑选项见 config.sample.English.yml 和 docs/personal-digest.md。
# 所有生成内容的语言由 language 统一控制。
log_level: INFO
language: ${DIGEST_LANGUAGE:-Chinese}

state:
  directory: /app/data

miniflux:
  base_url: http://miniflux:8080
  browser_url: https://your.server.com
  api_key: ${MINIFLUX_API_KEY}
  enrichment_mode: legacy_content # metadata requires the Miniflux fork; see docs/metadata.md
  timeout: 30
  retries: 2

metadata:
  relevance_criteria: ${MINIFLUX_AI_RELEVANCE_CRITERIA:-} # Required personal policy in metadata mode
  input_fields: []

article_fetch: # Metadata mode: read-only Miniflux preview with the feed's scraper/rewrite rules
  mode: thin # "off", thin, always
  min_feed_chars: 500
  min_article_chars: 200
  timeout: 30
  max_bytes: 2097152
  max_text_chars: 20000
  retries: 1

llm:
  provider: openai
  api: chat_completions # Or responses with a compatible OpenAI gateway
  structured_output: json_object # Or prompt when API JSON mode is rejected; validation stays strict
  base_url: http://host.docker.internal:11434/v1
  api_key: ${LLM_API_KEY:-ollama}
  model: llama3.1:latest
  timeout: 300
  max_workers: 2
  RPM: 15
  retries: 2

ai_news:
  url: http://miniflux_ai:${FLASK_PORT:-80}
  timezone: ${DIGEST_TIMEZONE:-Asia/Shanghai}
  schedule: ["07:30", "18:00", "22:00"]
  editorial:
    at_a_glance_words: 75
    max_stories: 8
    max_groups: 3
  weather:
    enabled: false
    location: ""
    latitude: null
    longitude: null
    units: metric

agents:
  summary:
    title: 'AI 摘要：'
    style_block: true
  translate:
    title: 'AI 翻译：'
    prompt: Translate the article into ${language}, preserving qualifications and uncertainty. Do not add commentary.
    style_block: false
    allow_list:
      - https://9to5mac.com/

feeds_status:
  enabled: true
  url: http://miniflux_ai:${FLASK_PORT:-80}
  schedule: "09:00"
